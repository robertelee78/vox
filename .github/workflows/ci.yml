name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: build · clippy · fmt · test
    # ADR-015 scopes clients to macOS + Linux; the core is checked on both.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel + components (rustfmt, clippy).
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Format check
        run: cargo fmt --all --check
      # Vox is pure Rust (ADR-001 principle 10): there are no optional native
      # backends to feature-gate; the default build IS the whole build.
      - name: Clippy (default, pure-Rust)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (default, pure-Rust)
        run: cargo test --workspace
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      # Production-parameter PoW gate (ADR-005): a real (200,9) Equihash solve
      # cross-checked by the librustzcash verifier. Ignored in the debug suite
      # (≈25 s unoptimized) and run here in release (≈1 s, 245 MB).
      - name: Real-parameter PoW solve→verify (release)
        run: cargo test --release -p vox-core --lib real_200_9_solve_then_verify -- --ignored
