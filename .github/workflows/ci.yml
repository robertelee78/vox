name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The gaps ADR-018 §3 accepts today, named so that accepting them is a visible decision.
  # Removing one MUST make the proofs fail until it is closed.
  # The gaps ADR-018 §3 accepts, named so accepting them is a visible decision. `fish` is NOT
  # here: the runners install it below, which is how that gap gets closed rather than excused.
  VOX_PROOF_ALLOW_UNPROVEN: "journey.update_replaces_an_older_install,install.apple_gate_refuses_unsigned_bytes,opencode,cross-process-join,cross-process-tunnel"

jobs:
  build-test:
    name: build · clippy · fmt · test
    # ADR-015 scopes clients to macOS + Linux; the core is checked on both.
    strategy:
      # Both platforms report. Without this, one failure cancels the other and the second
      # platform's state is never learned — which is how a red ubuntu hid macOS for ten runs.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel + components (rustfmt, clippy).
      # `shell_setup_proof` measures real shells. A shell that is absent is reported unproven and
      # FAILS (ADR-018 §3), so the runners install the ones it proves against rather than the
      # proof being excused. ubuntu-latest ships neither zsh nor fish; macOS ships zsh only.
      - name: Install the shells the proofs measure
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y zsh fish
          else
            brew install fish
          fi
          zsh --version && fish --version && bash --version | head -1
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Format check
        run: cargo fmt --all --check
      # Vox is pure Rust (ADR-001 principle 10): there are no optional native
      # backends to feature-gate; the default build IS the whole build.
      - name: Clippy (default, pure-Rust)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (default, pure-Rust)
        run: cargo test --workspace
        env:
          # `update_proof` asks GitHub which releases exist, to find one to update *from*.
          GH_TOKEN: ${{ github.token }}
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      # Real-parameter gates that are too slow unoptimized and therefore
      # `#[ignore]`d in the debug suite: the (200,9) Equihash solve→verify
      # (ADR-005, ≈1 s / 245 MB in release) and the production-Argon2id node +
      # live-client lifecycle tests (ADR-016 M13; ≈0.3 s per derivation in
      # release). Run here in release.
      - name: Real-parameter gates (release)
        run: cargo test --release --workspace -- --ignored
