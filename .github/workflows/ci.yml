name: CI

# V210-145 (#364) SPIKE, on a throwaway branch whose draft PR is closed unmerged: this replaces the
# whole CI for this branch only. It runs one deliberately hung proof on ubuntu, so the hung-proof
# watchdog's Linux dump can be read: as it is, with the dump removed, and with the processes
# declaring PR_SET_PTRACER_ANY (no privilege).

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  hung-proof-dump:
    name: hung proof dump (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [as-is, no-dump-mutant, ptracer-any]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The environment the dump depends on
        run: |
          set -u
          echo "gdb: $(command -v gdb || echo 'not installed')"
          gdb --version 2>/dev/null | head -1 || true
          echo "kernel.yama.ptrace_scope: $(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo 'absent')"
          uname -a
      - name: The no-dump mutant (the dump calls removed)
        if: matrix.variant == 'no-dump-mutant'
        run: |
          set -eu
          f=crates/vox-core/tests/support/watchdog.rs
          grep -c 'dump_threads(std::process::id());' "$f"
          grep -c 'dump_descendants(&children);' "$f"
          sed -i 's|    dump_threads(std::process::id());|    // MUTANT-V210-145: no dump|' "$f"
          sed -i 's|    dump_descendants(&children);|    let _ = \&children; // MUTANT-V210-145: no dump|' "$f"
          git diff --stat
      - name: Build the spike
        run: cargo test --release -p vox-tui --features test-knobs --test v210_145_hung_spike --no-run
      - name: Run the spike (it hangs; the watchdog fires at 40 s)
        continue-on-error: true
        env:
          VOX_TEST_WATCHDOG_SECS: "40"
          VOX_SPIKE_PTRACER: ${{ matrix.variant == 'ptracer-any' && '1' || '0' }}
        run: |
          set -u
          cargo test --release -p vox-tui --features test-knobs --test v210_145_hung_spike \
            -- --ignored --nocapture 2>&1 | tee spike.log
          echo "exit: ${PIPESTATUS[0]}"
      - name: What the log holds
        if: always()
        run: |
          set -u
          echo "watchdog banner: $(grep -c 'vox test watchdog' spike.log || true)"
          echo "descendant headers: $(grep -c 'vox test watchdog: descendant' spike.log || true)"
          echo "thread census lines: $(grep -c 'threads (tid, state' spike.log || true)"
          echo "gdb thread headers: $(grep -cE '^Thread [0-9]+ ' spike.log || true)"
          echo "gdb frames: $(grep -cE '^#[0-9]+ ' spike.log || true)"
          echo "ptrace refusals: $(grep -ciE 'ptrace: Operation not permitted|could not attach' spike.log || true)"
          echo "descendants left: $(grep 'remain' spike.log || true)"
