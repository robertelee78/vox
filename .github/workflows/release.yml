name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The gaps ADR-018 §3 accepts today. Removing one MUST make the proofs fail until it is
  # closed — that is what makes an accepted gap a decision rather than a silence.
  VOX_PROOF_ALLOW_UNPROVEN: "fish,journey.update_replaces_an_older_install,verify.digest_mismatch_is_refused"

jobs:
  # ADR-018 §6: nothing is published from a tree the gates have not passed on. The tag is the
  # tree users will run, so it is the tree that gets proved — not merely the branch it came from.
  gates:
    name: gates (fmt · clippy · test · docs)
    runs-on: ubuntu-latest
    # Set once for the whole job so every step shares one flag set and nothing is rebuilt
    # between them. Deliberately NOT workflow-wide: a release build has no business failing on
    # a dependency's warning under a cross-compile.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel + components (rustfmt, clippy).
      - run: rustc --version && cargo --version
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # `update_proof` asks GitHub which releases exist, to find one to update *from*.
          GH_TOKEN: ${{ github.token }}
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - run: cargo test --release --workspace -- --ignored

  build-linux-x64:
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --release --bin vox
          strip target/release/vox
          ls -lh target/release/vox

      - name: Package release assets
        run: scripts/package-release.sh target/release/vox x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist/*

  build-darwin-arm64:
    needs: [gates]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --release --bin vox
          strip target/release/vox
          ls -lh target/release/vox

      # Signing happens AFTER `strip` — strip rewrites the Mach-O and invalidates any earlier
      # signature — and BEFORE packaging, so the record's digest covers the signed bytes.
      # Without a Developer ID signature Gatekeeper quarantines the download, and "clear the
      # quarantine flag by hand" is not an acceptable first run for a tool whose purpose is
      # confidentiality (ADR-015).
      - name: Sign and notarize (Developer ID)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: scripts/sign-macos.sh target/release/vox

      - name: Package release assets
        run: scripts/package-release.sh target/release/vox aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: dist/*

  build-darwin-x64:
    needs: [gates]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        # rust-toolchain.toml pins the channel; the extra target is added explicitly because
        # the file does not list targets.
      - run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --release --target x86_64-apple-darwin --bin vox
          strip target/x86_64-apple-darwin/release/vox
          ls -lh target/x86_64-apple-darwin/release/vox

      # See the arm64 job. Note additionally that `strip` on a cross-built x86_64 binary
      # removes its ad-hoc signature entirely, so signing is what makes the Intel package
      # runnable at all.
      - name: Sign and notarize (Developer ID)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: scripts/sign-macos.sh target/x86_64-apple-darwin/release/vox

      - name: Package release assets
        run: scripts/package-release.sh target/x86_64-apple-darwin/release/vox x86_64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-apple-darwin
          path: dist/*

  publish:
    needs: [build-linux-x64, build-darwin-arm64, build-darwin-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          set -eu
          # ADR-015: the GitHub Release IS the distribution. Per target: the binary, its
          # .sha256 for humans, the `stable-<triple>.json` record that `vox update` and
          # install.sh resolve through releases/latest/download/, and the `proof-<triple>.json`
          # record whose digest is deliberately wrong (ADR-018 §3: it is what makes the
          # updater's mismatch refusal provable without breaking anybody's stable channel).
          # Plus install.sh itself, so a pinned copy travels with every release.
          mkdir -p release
          cp artifacts/*/vox-* artifacts/*/stable-*.json artifacts/*/proof-*.json release/
          cp install.sh release/install.sh
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "ERROR: tag ${TAG} does not match the workspace version ${VERSION}"; exit 1
          fi
          # Every record must carry this version, or `vox update` would resolve the wrong tag.
          for r in release/stable-*.json release/proof-*.json; do
            grep -q "\"version\":\"${VERSION}\"" "$r" || { echo "ERROR: $r is not for ${VERSION}"; cat "$r"; exit 1; }
          done
          # Three targets, so three of each.
          for pat in 'release/vox-*' 'release/stable-*.json' 'release/proof-*.json'; do
            n=$(ls $pat | grep -cv '\.sha256$')
            [ "$n" = 3 ] || { echo "ERROR: expected 3 of $pat, found $n"; ls -l release; exit 1; }
          done
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          generate_release_notes: true
