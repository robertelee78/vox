name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The gaps ADR-018 §3 accepts today. Removing one MUST make the proofs fail until it is
  # closed — that is what makes an accepted gap a decision rather than a silence.
  #
  # `opencode` — the M19.7 rehearsal and the OpenCode plugin proof drive a **live model**
  # through a real harness. A CI runner has neither the harness nor a credential, so they
  # report unproven here and are proved on a developer machine instead. Removing this name
  # does not make CI prove them; it makes CI fail.
  # `cross-process-join` / `cross-process-tunnel` — the open reachability defects recorded
  # in ADR-012 and ADR-016 with measurements. Named separately so a tunnel regression
  # cannot hide behind a join defect, or the reverse.
  # `journey.update_replaces_an_older_install` — this claim drives a **published binary**,
  # not this tree: it runs v<older>'s own `vox update`. v0.1.0 and v0.2.0 shipped the Linux
  # ETXTBSY defect (ADR-015), so on Linux they cannot update to anything and no change here
  # can alter that. The proof reports it blocked with the versions named, and the condition
  # clears itself once the newest release other than the current one is >= v0.2.1.
  # `verify.digest_mismatch_is_refused` was REMOVED on 2026-09-22: it had been excused since
  # v0.1.0, and while it was excused the `proof` channel record was unreadable by every
  # released binary, so the refusal it names had never once run. It passes now, and an
  # accepted gap that has closed MUST be removed rather than renewed — otherwise the next
  # regression is green.
  # See ci.yml: `fish` is not excused here, the gates job installs it.
  VOX_PROOF_ALLOW_UNPROVEN: "journey.update_replaces_an_older_install,install.apple_gate_refuses_unsigned_bytes,opencode,cross-process-join,cross-process-tunnel"

jobs:
  # ADR-018 §6: nothing is published from a tree the gates have not passed on. The tag is the
  # tree users will run, so it is the tree that gets proved — not merely the branch it came from.
  gates:
    name: gates (fmt · clippy · test · docs)
    runs-on: ubuntu-latest
    # 60, not 45: this job compiles every release target and then runs the whole `--ignored` suite,
    # which is ~20 minutes of the total on a developer machine and longer on a shared runner. At 45
    # a green release was a race against the clock — v0.2.5's run reached 32 minutes with the release
    # suite still going. A gate that fails on its own budget teaches nobody anything.
    # 120, not 60: v0.2.9's first run was cancelled at 60 minutes inside the R41 perf proof with 141
    # results green and 0 failed; the release suite alone ran 54 minutes (the R42 relay proof ~11,
    # a restarted host ~5) and had vox-tui still to go.
    timeout-minutes: 120
    # Set once for the whole job so every step shares one flag set and nothing is rebuilt
    # between them. Deliberately NOT workflow-wide: a release build has no business failing on
    # a dependency's warning under a cross-compile.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel + components (rustfmt, clippy).
      # See ci.yml: the proofs measure real shells, so the runner installs them.
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      # `codex_trust_proof` asks Codex itself whether Vox's hook is trusted, and refuses to pass
      # without `codex` on PATH (an absent Codex is not a pass). Pinned to the version it was
      # measured on: the app-server's `hooks/list` statuses are Codex's, not Vox's, to change.
      - run: npm install -g @openai/codex@0.157.0 && codex --version
      - run: rustc --version && cargo --version
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
        env:
          # `update_proof` asks GitHub which releases exist, to find one to update *from*.
          GH_TOKEN: ${{ github.token }}
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      # Two proofs are excluded here **by name, with their measured rates**, because they are
      # flaky rather than red and retrying a release until luck lets it through is not evidence:
      #
      #   cross_process_join_proof      4 ok of 6 measured locally (~1 in 3 fails)
      #   relayed_path_is_retried       RESTORED to the blocking set for v0.2.9 (V29-14): 48 ok of 48 on
      #                                 36b5c94 (8 interleaved with v0.2.8, which was 8 of 8, plus 40), where
      #                                 it had been 4 of 5 on main and failed once in CI.
      #
      # Both are tracked as open defects in ADR-018. `cross-process-join` already sits on
      # VOX_PROOF_ALLOW_UNPROVEN above, which records that its claim is unproven but does not stop
      # it failing this gate. Excluding them is stated, not hidden: a release built this way has NOT
      # been shown to carry a log entry between processes, and the release notes must say so.
      # `work_board_proof` was excluded here on 2026-09-24 and the exclusion is now REMOVED, because
      # its cause is fixed rather than tolerated: ADR-020 §5's one-second `created_secs` resolution
      # sent two claims in the same second to an entry-hash tie-break that is deterministic but not
      # causal. M19.9 gives the timestamp millisecond resolution. Measured: 1 failure in 3 before, on
      # both `main` and v0.2.5's commit; 6 of 6 after, at loads 4-45 — and high load is the *harder*
      # condition for this race, since a quiet box is what packs a claim and a release into one second.
      # It is back in the blocking set, which is where a proof belongs once it can pass for a reason.
      # `service_rehearsal_proof` was excluded here on 2026-09-23 and the exclusion is now REMOVED,
      # because its cause is fixed rather than tolerated. It failed at the stranger's join (`:490`):
      # `spawn_accept_loop` awaited `finish_incoming` inline, so a host that had answered one joiner
      # answered nobody for up to `HANDSHAKE_TIMEOUT` (30s), and `vox connect` exits the moment it has
      # joined, which leaves the host mid-handshake. v0.2.8 spawns each handshake on its own bounded
      # task, which closes ADR-017's "Open proof gap". Back in the blocking set.
      # `--no-fail-fast`: without it cargo stops at the first red test binary, and v0.2.9's run left
      # ~120 binaries unrun behind one red, so each run could show only one red per hour.
      - run: |
          cargo test --release --workspace --no-fail-fast -- --ignored \
            --skip two_agents_on_separate_processes_join_through_an_anchor_and_talk

  # **Reporting only, and in its OWN job on purpose.** These are the proofs excluded from the gate
  # above. Every command here ends in `|| echo "::warning::"`, so none of them can fail a release —
  # but while they lived as a step inside `gates` they could still *time out* that job, and a timed
  # out `gates` blocks the release completely. A step forbidden from failing the release could
  # nonetheless kill it, by spending a budget it shared with the real gate.
  #
  # That very nearly happened: adding a third proof here (`service_rehearsal_proof`, since restored to
  # the gate, whose failing
  # path burns its whole timeout) lengthened this work inside a 45-minute budget that the blocking
  # steps had already spent 32 minutes of.
  #
  # So it is a separate job that **nothing needs and which needs nothing**. It cannot consume the
  # gate's time, cannot block publication, and a rate that changes is still visible as a warning —
  # which is the entire reason these are run at all rather than deleted (ADR-018).
  flaky-watch:
    name: excluded proofs (reporting only — never blocks a release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No `VOX_PROOF_ALLOW_UNPROVEN` here: a job inherits the workflow-level `env` above, and the
    # `env` **context** is not available inside a job-level `env` block — writing
    # `${{ env.VOX_PROOF_ALLOW_UNPROVEN }}` there made GitHub reject this whole file, so the run
    # failed in 0s with no jobs and no log. v0.2.6's first two tags died that way.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      # Run them anyway, reporting only: a rate that changes is information, and a gate that hides
      # them entirely would let them rot.
      - run: |
          cargo test --release --workspace --no-fail-fast -- --ignored \
            two_agents_on_separate_processes_join_through_an_anchor_and_talk \
            || echo "::warning::cross_process_join_proof failed — known flake, ADR-018"

  build-linux-x64:
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --release --bin vox
          strip target/release/vox
          ls -lh target/release/vox

      - name: Package release assets
        run: scripts/package-release.sh target/release/vox x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist/*

  build-darwin-arm64:
    needs: [gates]
    runs-on: macos-latest
    timeout-minutes: 75  # includes waiting on Apple's notary service
    # Holds the Apple credentials. A fork or a pull request cannot reach them, so it cannot
    # produce a release artifact — which is the point: there is no unsigned fallback.
    environment: apple-release
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          # A decision, not a rustc default: see scripts/sign_notarize_release.sh. Both macOS
          # artifacts must claim the same floor, and it must be one vox actually supports.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --bin vox
          strip target/release/vox
          ls -lh target/release/vox
          vtool -show-build target/release/vox | grep -E "platform|minos"

      # Signing happens AFTER `strip` — strip rewrites the Mach-O and invalidates any earlier
      # signature — and BEFORE packaging, so the release record's digest covers the signed
      # bytes. The signer emits its own proof receipts (ADR-018).
      - name: Developer ID sign and notarize
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTIFIER: ${{ vars.APPLE_CODESIGN_IDENTIFIER }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          signed="$RUNNER_TEMP/vox-signed-aarch64-apple-darwin"
          scripts/sign_notarize_release.sh \
            target/release/vox "$signed" "$VERSION" aarch64-apple-darwin \
            "$APPLE_CODESIGN_IDENTIFIER" 11.0
          echo "SIGNED_DIR=$signed" >>"$GITHUB_ENV"

      - name: Package release assets
        run: |
          set -euo pipefail
          scripts/package-release.sh "$SIGNED_DIR/vox-aarch64-apple-darwin" aarch64-apple-darwin
          cp "$SIGNED_DIR"/apple-proof-*.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: dist/*

  build-darwin-x64:
    needs: [gates]
    runs-on: macos-latest
    timeout-minutes: 75  # includes waiting on Apple's notary service
    environment: apple-release
    steps:
      - uses: actions/checkout@v4
        # rust-toolchain.toml pins the channel; the extra target is added explicitly because
        # the file does not list targets.
      - run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          # See the arm64 job. rustc would otherwise default this target to 10.12.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target x86_64-apple-darwin --bin vox
          strip target/x86_64-apple-darwin/release/vox
          ls -lh target/x86_64-apple-darwin/release/vox
          vtool -show-build target/x86_64-apple-darwin/release/vox | grep -E "platform|minos"

      # See the arm64 job. Note additionally that `strip` on a cross-built x86_64 binary
      # removes its ad-hoc signature entirely, so signing is what makes the Intel package
      # runnable at all.
      - name: Developer ID sign and notarize
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTIFIER: ${{ vars.APPLE_CODESIGN_IDENTIFIER }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          signed="$RUNNER_TEMP/vox-signed-x86_64-apple-darwin"
          scripts/sign_notarize_release.sh \
            target/x86_64-apple-darwin/release/vox "$signed" "$VERSION" x86_64-apple-darwin \
            "$APPLE_CODESIGN_IDENTIFIER" 11.0
          echo "SIGNED_DIR=$signed" >>"$GITHUB_ENV"

      - name: Package release assets
        run: |
          set -euo pipefail
          scripts/package-release.sh "$SIGNED_DIR/vox-x86_64-apple-darwin" x86_64-apple-darwin
          cp "$SIGNED_DIR"/apple-proof-*.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-apple-darwin
          path: dist/*

  publish:
    needs: [build-linux-x64, build-darwin-arm64, build-darwin-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          set -eu
          # ADR-015: the GitHub Release IS the distribution. Per target: the binary, its
          # .sha256 for humans, the `stable-<triple>.json` record that `vox update` and
          # install.sh resolve through releases/latest/download/, and the `proof-<triple>.json`
          # record whose digest is deliberately wrong (ADR-018 §3: it is what makes the
          # updater's mismatch refusal provable without breaking anybody's stable channel).
          # Plus install.sh itself, so a pinned copy travels with every release.
          mkdir -p release
          cp artifacts/*/vox-* artifacts/*/stable-*.json artifacts/*/proof-*.json release/
          # ADR-018: the signing proof travels with the artifact it describes.
          cp artifacts/*/apple-proof-*.json release/
          cp install.sh release/install.sh
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "ERROR: tag ${TAG} does not match the workspace version ${VERSION}"; exit 1
          fi
          # Every record must carry this version, or `vox update` would resolve the wrong tag.
          for r in release/stable-*.json release/proof-*.json; do
            grep -q "\"version\":\"${VERSION}\"" "$r" || { echo "ERROR: $r is not for ${VERSION}"; cat "$r"; exit 1; }
          done
          # Three targets, so three of each.
          for pat in 'release/vox-*' 'release/stable-*.json' 'release/proof-*.json'; do
            n=$(ls $pat | grep -cv '\.sha256$')
            [ "$n" = 3 ] || { echo "ERROR: expected 3 of $pat, found $n"; ls -l release; exit 1; }
          done
          # Two macOS targets, so two signing proofs — and each MUST say Accepted for the
          # version being published. A missing proof is a macOS binary nobody can show was
          # notarized, which is exactly the "absent evidence reads as success" failure
          # ADR-018 §3 forbids.
          n=$(ls release/apple-proof-*.json | wc -l | tr -d ' ')
          [ "$n" = 2 ] || { echo "ERROR: expected 2 Apple signing proofs, found $n"; ls -l release; exit 1; }
          for r in release/apple-proof-*.json; do
            jq -e --arg v "${VERSION}" '
              .kind == "vox.apple-release-proof"
              and .version == $v
              and .signing.authority == "Developer ID Application"
              and .signing.hardened_runtime == true
              and .signing.secure_timestamp == true
              and .notarization.status == "Accepted"
              and .verification.codesign == "accepted"
              and .verification.online_notarization == "accepted"
              and .verification.notary_ticket_cdhash_matches == true
            ' "$r" >/dev/null || { echo "ERROR: $r does not attest a notarized ${VERSION}"; cat "$r"; exit 1; }
          done
          # The record's digest must describe the *signed* bytes that shipped.
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            want=$(jq -er .asset.sha256 "release/apple-proof-${t}.json")
            got=$(jq -er .sha256 "release/stable-${t}.json")
            [ "$want" = "$got" ] || { echo "ERROR: ${t}: release record digest ${got} is not the signed binary ${want}"; exit 1; }
          done
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          generate_release_notes: true
