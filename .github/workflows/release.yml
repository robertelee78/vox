name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # No proof runs in this workflow: the gates run in CI on the same commit (see `ci-passed`).

jobs:
  # ADR-018 §6: nothing is published from a tree the gates have not passed on. The tag is the
  # tree users will run, so it is the tree that gets proved — not merely the branch it came from.
  #
  # **The gates run once, in CI, on the tagged commit itself** (ADR-018, "Publish only what CI
  # proved", 2026-09-26). This job re-ran the whole suite that CI had just run on the same commit:
  # ~60 minutes per release spent proving a tree twice, and in v0.2.9 it was the second copy that hit
  # its time budget. Now it waits for CI's `push` run on `main` for exactly `github.sha` and passes
  # only if that run succeeded. A tag on a commit CI never ran on `main` cannot publish; tag a commit
  # that is on `main`. The tree proved is still the tree published: the same SHA.
  ci-passed:
    name: CI passed on this exact commit
    runs-on: ubuntu-latest
    # CI's slowest job has a 120-minute budget; a tag pushed straight after `main` waits for it.
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI's run on main for this commit, and require success
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          url="repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=1"
          seen=""
          for i in $(seq 1 280); do
            line=$(gh api "$url" --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.status) \(.conclusion) \(.html_url)"' || true)
            if [ -z "$line" ]; then
              # CI starts within seconds of a push to main; five minutes without one means this
              # commit was never pushed to main, which is a refusal, not a wait.
              if [ "$i" -ge 10 ]; then
                echo "::error::no CI run on main for $SHA — tag a commit that is on main and has been through CI"
                exit 1
              fi
            else
              set -- $line
              [ "$seen" != "$1 $2" ] && echo "CI run $1: $2 $3 ($4)" && seen="$1 $2"
              if [ "$2" = completed ]; then
                if [ "$3" = success ]; then
                  echo "CI passed on $SHA: $4"
                  exit 0
                fi
                echo "::error::CI on $SHA concluded '$3': $4 — nothing is published from a tree the gates did not pass"
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::CI on $SHA did not finish within this job's budget"
          exit 1

  build-linux-x64:
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --release --bin vox
          strip target/release/vox
          ls -lh target/release/vox

      - name: Package release assets
        run: scripts/package-release.sh target/release/vox x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist/*

  # ADR-014 M-27: the one macOS job. It builds `vox` and Vox.app for aarch64-apple-darwin only
  # (the Intel macOS target is not built at all, M-26a), signs `vox`, puts that signed binary in
  # the app at Contents/Helpers/vox, signs the app inside-out, notarizes and staples it, and
  # packages both. One job, so neither artifact can exist without the other.
  build-darwin-arm64:
    needs: [ci-passed]
    runs-on: macos-latest
    timeout-minutes: 120  # two notary submissions, each waited on
    # Holds the Apple credentials. A fork or a pull request cannot reach them, so it cannot
    # produce a release artifact — which is the point: there is no unsigned fallback.
    environment: apple-release
    env:
      # A decision, not a rustc default: macOS 13 is the floor SMAppService needs, and it is one
      # floor for vox and the app (ADR-014 M-26a). The signers assert it held.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --release --bin vox
          strip target/release/vox
          ls -lh target/release/vox
          vtool -show-build target/release/vox | grep -E "platform|minos"

      # Signing happens AFTER `strip` — strip rewrites the Mach-O and invalidates any earlier
      # signature — and BEFORE packaging, so the release record's digest covers the signed
      # bytes. The signer emits its own proof receipts (ADR-018).
      - name: Developer ID sign and notarize vox
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTIFIER: ${{ vars.APPLE_CODESIGN_IDENTIFIER }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          signed="$RUNNER_TEMP/vox-signed-aarch64-apple-darwin"
          scripts/sign_notarize_release.sh \
            target/release/vox "$signed" "$VERSION" aarch64-apple-darwin \
            "$APPLE_CODESIGN_IDENTIFIER" "$MACOSX_DEPLOYMENT_TARGET"
          echo "SIGNED_DIR=$signed" >>"$GITHUB_ENV"
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"

      # Built ad hoc signed, with each target's entitlements embedded; the Developer ID signature
      # is applied below, inside-out, keeping those entitlements.
      - name: Build Vox.app
        run: |
          set -euo pipefail
          app=$(scripts/build-macos-app.sh "$RUNNER_TEMP/app-build")
          scripts/assemble-macos-app.sh "$app" "$SIGNED_DIR/vox-aarch64-apple-darwin" \
            "$RUNNER_TEMP/app-assembled/Vox.app" "$VERSION" "$MACOSX_DEPLOYMENT_TARGET"

      - name: Developer ID sign, notarize and staple Vox.app
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTIFIER: ${{ vars.APPLE_CODESIGN_IDENTIFIER }}
        run: |
          set -euo pipefail
          signed_app="$RUNNER_TEMP/app-signed-aarch64-apple-darwin"
          scripts/sign_notarize_app.sh \
            "$RUNNER_TEMP/app-assembled/Vox.app" "$signed_app" "$VERSION" aarch64-apple-darwin \
            us.vox.app "$APPLE_CODESIGN_IDENTIFIER" "$MACOSX_DEPLOYMENT_TARGET"
          echo "SIGNED_APP_DIR=$signed_app" >>"$GITHUB_ENV"

      - name: Package release assets
        run: |
          set -euo pipefail
          scripts/package-release.sh "$SIGNED_DIR/vox-aarch64-apple-darwin" aarch64-apple-darwin
          scripts/package-release.sh "$SIGNED_APP_DIR/Vox-$VERSION-aarch64-apple-darwin.zip" \
            aarch64-apple-darwin app
          cp "$SIGNED_DIR"/apple-proof-aarch64-apple-darwin.json dist/
          cp "$SIGNED_APP_DIR"/apple-proof-app-aarch64-apple-darwin.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: dist/*

  publish:
    needs: [build-linux-x64, build-darwin-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          set -eu
          # ADR-015: the GitHub Release IS the distribution. Per target: the binary, its
          # .sha256 for humans, the `stable-<triple>.json` record that `vox update` and
          # install.sh resolve through releases/latest/download/, and the `proof-<triple>.json`
          # record whose digest is deliberately wrong (ADR-018 §3: it is what makes the
          # updater's mismatch refusal provable without breaking anybody's stable channel).
          # On macOS also Vox.app, with its own records (ADR-014 M-27). Plus install.sh itself,
          # so a pinned copy travels with every release.
          mkdir -p release
          cp artifacts/*/* release/
          cp install.sh release/install.sh
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "ERROR: tag ${TAG} does not match the workspace version ${VERSION}"; exit 1
          fi
          # Exactly a release's assets, every receipt attesting a notarized build of this
          # version, every record's digest its receipt's, and vox and Vox.app together or not at
          # all (ADR-015 17.19, ADR-014 M-27, ADR-028 I-3).
          scripts/check-release-assets.sh release "${VERSION}"
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          generate_release_notes: true
