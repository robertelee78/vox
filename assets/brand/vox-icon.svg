<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Vox</title>
  <!-- Made by scripts/brand-icon.sh from vox-mark.svg: edit the mark, not this file. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0c0d0f"
        stroke="#3a3b40" stroke-width="4"/>
  <g transform="translate(163.84,186) scale(1.36)">
  <!-- The Vox mark (ADR-028 L-10): a faceted V of five planes, lit from the upper left, with one
       accent glint at the vertex. Every plane is text.primary (#f0ece4) at its own opacity, so the
       mark reads on bg.base; the glint is the accent (#5ec8ff). Colours are the token file's
       (assets/theme/vox-tokens.json). The app icon is made from this file by
       scripts/brand-icon.sh. -->
  <!-- On a grid of 4 units: each arm is two faces of 44, the keel a diamond at the vertex. The
       shadow face is 0.50, so the right arm holds at 128 px. Drawn from y 104 to 444. -->
  <g id="planes" fill="#f0ece4">
    <!-- left arm, outer face: in the light -->
    <polygon points="80,104 124,104 220,328 256,400" fill-opacity="1"/>
    <!-- left arm, inner face -->
    <polygon points="124,104 168,104 256,296 220,328" fill-opacity="0.62"/>
    <!-- right arm, inner face -->
    <polygon points="344,104 388,104 292,328 256,296" fill-opacity="0.80"/>
    <!-- right arm, outer face: in shadow -->
    <polygon points="388,104 432,104 256,400 292,328" fill-opacity="0.50"/>
    <!-- the keel, where the arms meet -->
    <polygon points="256,296 292,328 256,400 220,328" fill-opacity="0.90"/>
  </g>
  <!-- the one glint, at the vertex -->
  <path id="glint" fill="#5ec8ff"
        d="M256,372 L262,402 L292,408 L262,414 L256,444 L250,414 L220,408 L250,402 Z"/>
  </g>
</svg>
