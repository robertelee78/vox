<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Vox</title>
  <!-- The Vox mark (ADR-028 L-10): a faceted V of five planes, lit from the upper left, with one
       accent glint at the vertex. Every plane is text.primary (#f0ece4) at its own opacity, so the
       mark reads on bg.base; the glint is the accent (#5ec8ff). Colours are the token file's
       (assets/theme/vox-tokens.json). The app icon is made from this file by
       scripts/brand-icon.sh. -->
  <!-- Drawn from y 112 to 444; raised 22 so it sits in the middle of the square. -->
  <g transform="translate(0,-22)">
  <g id="planes" fill="#f0ece4">
    <!-- left arm, outer face: in the light -->
    <polygon points="96,112 136,112 222,340 256,416" fill-opacity="1"/>
    <!-- left arm, inner face -->
    <polygon points="136,112 176,112 256,300 222,340" fill-opacity="0.56"/>
    <!-- right arm, inner face -->
    <polygon points="336,112 376,112 290,340 256,300" fill-opacity="0.74"/>
    <!-- right arm, outer face: in shadow -->
    <polygon points="376,112 416,112 256,416 290,340" fill-opacity="0.36"/>
    <!-- the keel, where the arms meet -->
    <polygon points="256,300 290,340 256,416 222,340" fill-opacity="0.88"/>
  </g>
  <!-- the one glint, at the vertex -->
  <path id="glint" fill="#5ec8ff"
        d="M256,388 L260,412 L284,416 L260,420 L256,444 L252,420 L228,416 L252,412 Z"/>
  </g>
</svg>
