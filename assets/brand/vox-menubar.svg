<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.4 1.6 15.2 15.2" width="18" height="18">
  <title>Vox</title>
  <!-- The Vox mark as the menu bar item's template image (18 pt): one solid V with the glint cut
       out at the vertex: the glint's part inside the V is a hole in the one path, not a mask, so
       the PDF made from it stays vector. Black with alpha only, so macOS draws it in the menu
       bar's own colour, light or dark. scripts/brand-icon.sh makes the asset from it. -->
  <path fill="#000" fill-rule="evenodd"
        d="M1.8,2.8 L5.6,2.8 L9,11 L12.4,2.8 L16.2,2.8 L9,16.2 Z M9,12.6 L9.45,14.3 L9.967,14.4 L9.727,14.846 L9.45,14.9 L9.209,15.812 L9,16.2 L8.791,15.812 L8.55,14.9 L8.273,14.846 L8.033,14.4 L8.55,14.3 Z"/>
</svg>
