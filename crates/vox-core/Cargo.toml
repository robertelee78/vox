[package]
name = "vox-core"
description = "Vox Lux shared core: identity, crypto, log/sync, transport, governance, tunneling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# What a peer says in a connection close goes through the same sanitiser as an author's name
# (V210-154).
vox-text = { path = "../vox-text" }
# A UDP socket's own drop count, for the receiver-overflow report (#218, ADR-024 RO-1): the one
# getsockopt the safe dependencies do not offer, in the one crate that allows `unsafe`.
vox-sockdrops = { path = "../vox-sockdrops" }
# The envelope a message's link card goes into (ADR-028 F-10, `node::card`): the app tier's
# vocabulary, which depends on nothing of the core's.
vox-agentcomms = { path = "../vox-agentcomms" }
# The structured-post index (V210-120) reads a body's `type`: generic JSON, no app vocabulary.
serde_json.workspace = true
sha2.workspace = true
# A shared folder's file list (ADR-028 F-8).
percent-encoding.workspace = true
unicode-normalization.workspace = true
# A link card, fetched once by the sender's node (ADR-028 F-10).
reqwest.workspace = true
thiserror.workspace = true
zeroize.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
ml-dsa.workspace = true
ml-kem.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
# At-rest storage & retention (ADR-010, M8).
argon2.workspace = true
region.workspace = true
# Channel join (ADR-005, M3).
curve25519-dalek.workspace = true
subtle.workspace = true
equihash.workspace = true
# An image share's preview (ADR-028 F-9, `node::preview`).
image.workspace = true
blurhash.workspace = true
base64.workspace = true
blake2b_simd.workspace = true
# Transport substrate (ADR-011, M9).
quinn.workspace = true
socket2.workspace = true
quinn-udp.workspace = true
quinn-proto.workspace = true
tracing.workspace = true
rustls.workspace = true
rustls-post-quantum.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
tokio.workspace = true
bytes.workspace = true
# Node runtime (ADR-016, M13).
redb.workspace = true
# The control socket's owner check (V210-72): this process's uid, without `unsafe`.
rustix.workspace = true
# OpenPGP v4 fingerprint of the native root (ADR-002 §GPG).
sha1.workspace = true

[features]
# **A deliberately misbehaving sync sender, for ADR-025's P9 and P10 proofs only.** No shipped build
# enables it: release.yml builds `--bin vox` with the default features, and refuses an artifact that
# carries the mutant's marker (scripts/package-release.sh). CI and the local release gate build it
# into its own target directory with `scripts/build-mutant-sender.sh` and name it to the proofs by
# `VOX_MUTANT_SENDER`; the mode is chosen per daemon by `VOX_MUTANT_SENDER_MODE`
# (see `log::sync::mutant`).
mutant-sender = []
# **Test-only knobs, for proofs only** (V210-105, #300). Each `VOX_TEST_*` variable stages a race
# or a failure (a delay, a lost hello, a shorter lifetime) that no `vox` command can, and with this
# feature off neither the variable's read nor the path it drives is compiled: the binary a person
# installs has none of them. Proofs build with it through vox-tui's `test-knobs`
# (`cargo test --features vox-tui/test-knobs`); release.yml builds `--bin vox` without it, and
# scripts/package-release.sh refuses an artifact that carries a `VOX_TEST_` string.
test-knobs = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
