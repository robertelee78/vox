# Vox for native apps (PRD-001 R30/R31, ADR-014): the macOS app's daemon client (VoxClient),
# and the node the iOS app runs inside its own process (VoxNode), since a phone cannot run a
# daemon beside an app. The boundary is UniFFI, as ADR-014 decided — typed, memory-safe, async,
# and the same Swift for macOS and iOS.
[package]
name = "vox-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vox for native apps: the daemon client and the embedded node (UniFFI)"

[lib]
name = "vox_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
# Generates the Swift bindings from the built library (`scripts/build-xcframework.sh`).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
vox-core = { path = "../vox-core" }
# The envelope a post with addressees, a reply or urgency is written as (ADR-020 4.5, 4.6).
vox-agentcomms = { path = "../vox-agentcomms" }
# A fingerprint as a person reads it, with its art (ADR-028 K-1, L-9): the one renderer the CLI
# and the TUI draw too.
vox-text = { path = "../vox-text" }
zeroize.workspace = true
uniffi.workspace = true
tokio.workspace = true
thiserror.workspace = true
