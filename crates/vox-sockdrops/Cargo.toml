[package]
name = "vox-sockdrops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "The narrow OS calls Vox needs that no safe crate offers: a UDP socket's own drop count (SO_MEMINFO), and another process's argv on macOS (KERN_PROCARGS2). The only Vox crate that allows unsafe."

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos"))'.dependencies]
libc = "0.2"
