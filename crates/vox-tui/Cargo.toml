# Vox Lux — Rust TUI client (ADR-015, M12).
#
# A single binary linking `vox-core` directly as a Rust crate (no FFI, no IPC
# control plane). The terminal-native home client for Linux/servers/SSH; peer to
# the macOS client (ADR-014) over the same core.
[package]
name = "vox-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vox Lux terminal client — serverless E2EE chat, consent, verification, and tunneling"

[lib]
name = "vox_tui"
path = "src/lib.rs"

[[bin]]
name = "vox"
path = "src/main.rs"

# Optional proofs: expensive real-binary proofs of user-facing claims, run by hand and blocking
# nothing. Without the feature each one compiles a stand-in instead, ignored with the reason
# "OPTIONAL PROOF NOT RUN" (tests/support/optional_proof.rs), so it is never silent and never red
# in CI. Run one with
# `cargo test --release -p vox-tui --features optional-proofs --test <name> -- --ignored`.
[features]
optional-proofs = []
heavy-proofs = ["optional-proofs"]
# **Live-model proofs** (2026-10-02): a model's turn may run a shell, and an unsandboxed one sent
# the contents of ~/.claude, ~/.codex and ~/.config to its provider. Only a build with this
# feature starts a model, and every such turn runs confined (tests/support/oc_sandbox.rs);
# without it each prints OPTIONAL PROOF NOT RUN. Live-model runs are ad hoc, on the decider's
# request, never in CI.
live-model-sandbox = ["optional-proofs"]
# **Test-only knobs, for proofs only** (V210-105): vox-core's `test-knobs`, which compiles the
# `VOX_TEST_*` variables into `vox`. The proofs that set one build with it and refuse, as CANNOT
# MEASURE, a `vox` without it. No shipped build enables it.
test-knobs = ["vox-core/test-knobs"]

[dependencies]
vox-core = { path = "../vox-core" }
# The app tier (ADR-020 §1). `vox room claim|release|handoff|board` are this crate's
# vocabulary and claim resolver made reachable from the product; without this
# dependency the model exists and nothing can use it.
vox-agentcomms = { path = "../vox-agentcomms" }
ratatui.workspace = true
crossterm.workspace = true
qrcode.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
zeroize.workspace = true
secrecy.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
# `vox update` verifies the release record's SHA-256 over the downloaded binary before anything
# is renamed into place (ADR-015 §"Install and update"). Same pin as vox-core, so there is one
# SHA-256 implementation in the tree.
sha2.workspace = true
# The release record is fetched into a private temporary directory, so `vox update --check`
# needs no write access to the install directory. Promoted from a dev-dependency for that.
tempfile.workspace = true
# `vox update` (ADR-015). See the workspace manifest for why each of these is here.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
# `vox daemon` asks for its passphrase with echo off and the terminal otherwise as it was
# (V210-153): `termios`.
rustix = { workspace = true, features = ["termios"] }
# ADR-021 §6: a minted operation id is 128 bits of OS randomness.
getrandom.workspace = true

# `tempfile` is a normal dependency above and is in scope for the integration proofs too.
[dev-dependencies]
# The at-rest floor proof re-derives the vault key the binary wrote, independently of
# vox-core, with the ADR-010 floor parameters hard-coded in the test.
argon2.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
# The R41 link emulator sizes its own UDP sockets' buffers (std cannot): a link does not drop
# packets at a 786 KB socket, and the emulator must not either.
socket2.workspace = true
# V210-49's proof plays the attacker who deletes one row of a stopped node's store: no vox command
# can, so the test opens the file itself (never while a vox process holds it).
redb.workspace = true
# V210-62's proof plays a peer that opens a handshake with the host and never finishes it: no vox
# command stops mid-handshake on purpose, so the test drives a QUIC client of its own.
quinn.workspace = true
# R41's comparison flow (ADR-024) presents a certificate of its own.
rcgen.workspace = true
rustls.workspace = true
# V210-85's proof stops `vox connect` at its passphrase prompts, which it shows only on a terminal:
# the test opens a pty of its own and reads the terminal's modes back after the stop.
rustix = { workspace = true, features = ["pty", "termios"] }
